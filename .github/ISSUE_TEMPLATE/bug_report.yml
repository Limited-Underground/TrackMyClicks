name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use SECURITY.md for vulnerabilities. Do not attach real databases, credentials or identifying logs/paths."
  - type: input
    id: version
    attributes:
      label: Version or commit and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction with synthetic data
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
